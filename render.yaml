# Render Blueprint: deploys the app as a static site.
# In Render: New > Blueprint, then pick this repo.
services:
  - type: web
    name: js-ref
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
